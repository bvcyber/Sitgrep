[project]
name = "sitgrep"
version = "3.8.3"
description = "Enhance your code review with Sitgrep"
authors = [
    { name = "John Ascher", email = "john.ascher@bureauveritas.com" }
]
maintainers = [
  { name = "John Ascher", email = "john.ascher@bureauveritas.com" }
]
readme = "README.md"
dependencies = [
    "gitpython>=3.1.43",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "psutil",
    "py7zr",
    "pydantic>=2",
    "PyYAML",
    "rarfile",
    "requests",
    "rich",
    "rich-argparse",
    "rs-chardet",
    "validators",
]
# 3.10: sitgrep.py uses match/case, and langchain 1.x (create_agent, langchain.messages) requires it
requires-python = ">=3.10"

[project.optional-dependencies]
web = ["flask"]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
sitgrep = "sitgrep:cli"
